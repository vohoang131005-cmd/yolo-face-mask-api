<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Nhận Diện Khẩu Trang (Cloud)</title>
    <link rel="stylesheet" href="/static/style.css">
    <!-- Dùng Bootstrap cho giao diện đẹp -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <div class="container mt-4">
        <h2 class="text-center text-info mb-4">HỆ THỐNG NHẬN DIỆN KHUÔN MẶT (YOLOv8 CLOUD)</h2>
        
        <div class="row">
            <!-- CỘT TRÁI: CAMERA -->
            <div class="col-md-7">
                <div class="card bg-secondary p-2 shadow">
                    <div class="position-relative" style="height: 480px;">
                        <!-- Video từ webcam -->
                        <video id="video" autoplay playsinline class="w-100 h-100 rounded object-fit-cover"></video>
                        <!-- Lớp vẽ khung (Canvas) đè lên video -->
                        <canvas id="overlay" class="position-absolute top-0 start-0 w-100 h-100 rounded"></canvas>
                    </div>
                    <div class="mt-3 d-flex justify-content-between align-items-center">
                        <button id="startBtn" class="btn btn-success fw-bold px-4">Bật Camera</button>
                        <span id="stats" class="badge bg-warning text-dark fs-6 p-2">Chưa có dữ liệu</span>
                    </div>
                </div>
            </div>

            <!-- CỘT PHẢI: LỊCH SỬ DATABASE -->
            <div class="col-md-5">
                <div class="card bg-secondary p-3 shadow" style="max-height: 550px; overflow-y: auto;">
                    <h5 class="text-warning border-bottom border-light pb-2">📸 Lịch sử vi phạm (Database)</h5>
                    <div id="historyList" class="mt-3">
                        <p class="text-muted text-center">Chưa có dữ liệu vi phạm...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
